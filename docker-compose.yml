services:
  postgres:
    image: postgres:16-alpine
    container_name: bullsync-db
    environment:
      POSTGRES_DB: bullsync
      POSTGRES_USER: bullsync_user
      POSTGRES_PASSWORD: bullsync_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: